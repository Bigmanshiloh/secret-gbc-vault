<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Secret GBC Vault</title>
<style>
:root{--ink:#182028;--shell:#9aa0aa;--dark:#555b68;--screen:#a8c77a;--accent:#5b3f91}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#252b35,#090b10 65%);color:#eef2f6;font-family:system-ui,Arial,sans-serif;display:grid;place-items:center;padding:20px}
.app{width:min(920px,100%)}.panel{background:linear-gradient(#b5bac3,#7d838e);border:5px solid #3f4550;border-radius:26px;padding:22px;box-shadow:0 25px 70px #000b}
h1{margin:0;text-align:center;letter-spacing:5px;color:#241b32;text-shadow:1px 1px #d7dbe0}.sub{text-align:center;color:#292e38;margin:4px 0 18px}
.screen-wrap{background:#252a31;padding:18px;border-radius:16px;box-shadow:inset 0 0 0 3px #111}
.screen{aspect-ratio:10/9;background:var(--screen);color:#203020;border:7px solid #111;border-radius:6px;display:grid;place-items:center;text-align:center;position:relative;overflow:hidden}
#game{width:100%;height:100%;image-rendering:pixelated;background:#8bac0f}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#111c;color:#dff4ae}.hidden{display:none}
.menu{padding:20px}.menu h2{margin:0 0 8px}.menu p{margin:6px 0}.controls{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-top:20px}
.dpad{display:grid;grid-template-columns:48px 48px 48px;grid-template-rows:48px 48px 48px;gap:4px}.dpad button:nth-child(1){grid-column:2}.dpad button:nth-child(2){grid-column:1;grid-row:2}.dpad button:nth-child(3){grid-column:2;grid-row:2}.dpad button:nth-child(4){grid-column:3;grid-row:2}
button{border:0;border-radius:10px;background:#343944;color:white;font-weight:800;padding:12px 16px;cursor:pointer;box-shadow:0 4px 0 #171a20}button:active{transform:translateY(3px);box-shadow:0 1px 0 #171a20}.actions{display:flex;gap:10px}.actions button{border-radius:50%;width:58px;height:58px;background:#653f8f}.bar{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:18px}.bar input{display:none}.bar label, .bar button{background:#242934;padding:11px 14px;border-radius:9px;color:white}.games{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px}.games button{background:#49505c}
.hint{text-align:center;font-size:.88rem;color:#262b34;margin:14px 0 0}.status{text-align:center;margin-top:8px;color:#1d222a;font-weight:700}
@media(max-width:600px){.panel{padding:12px}.controls{gap:8px}.dpad{transform:scale(.85);transform-origin:left center}.actions{transform:scale(.85);transform-origin:right center}}
</style>
</head>
<body>
<main class="app">
<section class="panel">
<h1>SECRET GBC VAULT</h1>
<div class="sub">GAME BOY COLOR // CLASSIFIED ARCADE</div>

<div class="screen-wrap">
<div class="screen">
<canvas id="game" width="160" height="144" aria-label="GBC game screen"></canvas>
<div id="lock" class="overlay">
<div class="menu">
<h2>🔒 ACCESS LOCKED</h2>
<p>Enter the secret code to open the vault.</p>
<p><strong>Hint:</strong> the classic handheld has four face buttons.</p>
<p><button id="unlock">ENTER VAULT</button></p>
</div>
</div>
</div>
</div>

<div id="vault" class="hidden">
<div class="games">
<button data-demo="1">Pixel Runner</button>
<button data-demo="2">Color Blocks</button>
<button id="fullscreen">Fullscreen</button>
</div>
<div class="bar">
<label for="rom">Load your legally obtained ROM (.gb/.gbc)</label>
<input id="rom" type="file" accept=".gb,.gbc">
<button id="reset">Reset Demo</button>
</div>
<div class="controls">
<div class="dpad">
<button data-key="ArrowUp">▲</button><button data-key="ArrowLeft">◀</button><button data-key="ArrowDown">▼</button><button data-key="ArrowRight">▶</button>
</div>
<div><button data-key="Select">SELECT</button><button data-key="Start">START</button></div>
<div class="actions"><button data-key="KeyB">B</button><button data-key="KeyA">A</button></div>
</div>
<p class="status" id="status">Demo mode — choose a game.</p>
</div>
<p class="hint">Keyboard: arrows + Z/X • Enter = Start • Shift = Select</p>
</section>
</main>

<script>
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');
ctx.imageSmoothingEnabled=false;
const lock=document.querySelector('#lock'),vault=document.querySelector('#vault'),status=document.querySelector('#status');
let mode=1, player={x:20,y:110,vy:0}, keys={};
function draw(){
 ctx.fillStyle='#9bbc0f';ctx.fillRect(0,0,160,144);
 ctx.fillStyle='#306230';ctx.fillRect(0,125,160,19);
 if(mode===1){
   ctx.fillStyle='#0f380f';ctx.fillRect(player.x,player.y,10,15);
   ctx.fillRect(player.x+2,player.y-5,6,5);
   ctx.fillStyle='#0f380f';ctx.fillRect(100,110,12,15);ctx.fillRect(140,95,10,30);
 }else{
   for(let y=0;y<6;y++)for(let x=0;x<8;x++){
     ctx.fillStyle=(x+y)%2?'#306230':'#0f380f';ctx.fillRect(10+x*18,8+y*18,16,16);
   }
 }
 requestAnimationFrame(draw);
}
function unlock(){lock.classList.add('hidden');vault.classList.remove('hidden');status.textContent='Demo mode — choose a game.'}
document.querySelector('#unlock').onclick=unlock;
document.querySelectorAll('[data-demo]').forEach(b=>b.onclick=()=>{mode=+b.dataset.demo;status.textContent=mode===1?'Pixel Runner demo':'Color Blocks demo';});
document.querySelector('#reset').onclick=()=>{player={x:20,y:110,vy:0};status.textContent='Demo reset.'};
document.querySelector('#fullscreen').onclick=()=>document.querySelector('.panel').requestFullscreen?.();
window.addEventListener('keydown',e=>{
 keys[e.code]=true;
 if(e.code==='Enter'&&!vault.classList.contains('hidden'))status.textContent='START pressed';
 if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();
});
window.addEventListener('keyup',e=>keys[e.code]=false);
document.querySelectorAll('[data-key]').forEach(b=>{
 const k=b.dataset.key;
 b.onpointerdown=e=>{e.preventDefault();keys[k]=true};
 b.onpointerup=b.onpointerleave=()=>keys[k]=false;
});
document.querySelector('#rom').onchange=e=>{
 const f=e.target.files[0]; if(!f)return;
 status.textContent=`Selected ${f.name}. A full emulator core must be supplied/hosted to execute ROMs.`;
};
function loop(){
 if(keys.ArrowLeft||keys.KeyA)player.x=Math.max(0,player.x-1);
 if(keys.ArrowRight)player.x=Math.min(150,player.x+1);
 requestAnimationFrame(loop);
}
draw();loop();
</script>
</body>
</html>
